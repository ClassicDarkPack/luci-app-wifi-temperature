<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated LuCI Wi-Fi radio temperature widget</title>
  <desc id="desc">Illustration of LuCI Status Overview displaying three sample Wi-Fi temperature readings, not an actual screenshot.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101e32"/>
      <stop offset="1" stop-color="#0a1425"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="510" rx="22" fill="#07101e"/>
  <rect x="0" y="0" width="216" height="510" rx="22" fill="#0d1b2d"/>
  <rect x="198" width="18" height="510" fill="#0d1b2d"/>
  <rect x="22" y="27" width="35" height="35" rx="9" fill="#2083c8"/>
  <path d="M31 40q9-9 18 0m-14 5q5-5 10 0m-6 5h1" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="71" y="51" fill="#f1f5f9" font-size="20" font-weight="bold">OpenWrt LuCI</text>
    <text x="26" y="112" fill="#8294ab" font-size="13" letter-spacing="2">NAVIGATION</text>
    <text x="27" y="159" fill="#9db0c8" font-size="18">Dashboard</text>
    <rect x="14" y="190" width="190" height="46" rx="9" fill="#19354b"/>
    <rect x="14" y="195" width="4" height="36" rx="2" fill="#38bdf8"/>
    <text x="29" y="220" fill="#e7f7ff" font-size="18" font-weight="bold">Status</text>
    <text x="42" y="264" fill="#7dd3fc" font-size="16">Overview</text>
    <text x="27" y="329" fill="#9db0c8" font-size="18">System</text>
    <text x="27" y="377" fill="#9db0c8" font-size="18">Network</text>
    <text x="260" y="63" fill="#94a3b8" font-size="17">Status / Overview</text>
    <text x="260" y="108" fill="#f8fafc" font-size="30" font-weight="bold">Router overview</text>
    <rect x="260" y="137" width="794" height="307" rx="18" fill="url(#surface)" stroke="#2d425d" stroke-width="2"/>
    <rect x="286" y="163" width="44" height="44" rx="10" fill="#0b5d70"/>
    <path d="M296 178q12-12 24 0m-19 7q7-7 14 0m-8 8h2" stroke="#a5f3fc" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <text x="347" y="191" fill="#f8fafc" font-size="23" font-weight="bold">Wi-Fi radio temperature</text>
    <rect x="885" y="165" width="138" height="31" rx="15" fill="#164e4b"/>
    <text x="954" y="186" fill="#99f6e4" font-size="12" text-anchor="middle" font-weight="bold">SAMPLE DATA</text>
    <line x1="286" y1="227" x2="1026" y2="227" stroke="#2e4057"/>
    <text x="296" y="268" fill="#ccdbeb" font-size="19">Highest Wi-Fi temperature</text>
    <text x="1009" y="268" fill="#7dd3fc" font-size="22" text-anchor="end" font-weight="bold">54.2 °C</text>
    <line x1="286" y1="291" x2="1026" y2="291" stroke="#25374d"/>
    <text x="296" y="332" fill="#ccdbeb" font-size="19">Wi-Fi 2.4 GHz</text>
    <text x="1009" y="332" fill="#7dd3fc" font-size="22" text-anchor="end" font-weight="bold">46.0 °C</text>
    <line x1="286" y1="355" x2="1026" y2="355" stroke="#25374d"/>
    <text x="296" y="395" fill="#ccdbeb" font-size="19">Wi-Fi 5 GHz</text>
    <text x="1009" y="395" fill="#7dd3fc" font-size="22" text-anchor="end" font-weight="bold">54.2 °C</text>
    <text x="260" y="479" fill="#9badc4" font-size="15">Illustration only — values are examples, not live sensor measurements.</text>
  </g>
</svg>
